# Police HQ Render Blueprint (database is Neon, so no Render database here).
# Secret values are NOT stored in this file: import them from render.env in the Render dashboard.
services:
  - type: web
    name: policehq
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/live/
    envVars:
      - key: ARMYHQ_PROFILE
        value: police
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: ARMYHQ_ADMIN_PASSWORD
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: ARMYHQ_SITE_URL
        value: https://policehq.onrender.com
      - key: DJANGO_ALLOWED_HOSTS
        value: policehq.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://policehq.onrender.com
      - key: TRUST_PROXY_HEADERS
        value: "1"
      - key: NUM_PROXIES
        value: "3"
      - key: SECURE_SSL_REDIRECT
        value: "0"
      - key: SESSION_IDLE_SECONDS
        value: "1800"
      - key: SESSION_ABSOLUTE_SECONDS
        value: "43200"
      - key: ARMYHQ_BREAK_GLASS
        value: "0"
      - key: PERSONNEL_EXPORT_ENABLED
        value: "0"
      - key: REPORT_EXPORT_ENABLED
        value: "0"
      - key: INTEGRATIONS_ENABLED
        value: "0"
      - key: ENABLE_API_DOCS
        value: "0"
      - key: LOG_LEVEL
        value: INFO
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ARMYHQ_ALERT_EMAILS
        sync: false
      - key: EMAIL_VERIFICATION_ENABLED
        value: "0"
      - key: PASSWORD_FORGOT_ENABLED
        value: "0"
